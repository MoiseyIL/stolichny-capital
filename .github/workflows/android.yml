name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: node scripts/prepare-www.mjs

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Set app version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android-keystore/stolichny.keystore" \
            -Pandroid.injected.signing.store.password=stolichny1991 \
            -Pandroid.injected.signing.key.alias=stolichny \
            -Pandroid.injected.signing.key.password=stolichny1991

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "stolichny-capital-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: stolichny-capital-apk
          path: stolichny-capital-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Столичный капитал 1.0.${{ github.run_number }}
          body: |
            Android-приложение «Столичный капитал». Скачайте APK ниже и откройте его на телефоне.
            Если Android спросит, разрешите установку из этого источника.
          files: stolichny-capital-*.apk
          make_latest: true
